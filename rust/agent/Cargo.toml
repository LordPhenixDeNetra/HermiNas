[package]
name = "herminas-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
csv = "1"
regex = "1"
zstd = "0.13"
thiserror = "1"
async-trait = "0.1"
tonic = "0.12"
herminas-protocol = { path = "../protocol" }

[dev-dependencies]
tempfile = "3"
reqwest = "0.12"
